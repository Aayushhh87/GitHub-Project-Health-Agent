openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GitHub Project Health Agent API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Repository analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeRepository
      tags: [analysis]
      summary: Analyze a public GitHub repository
      description: Fetches repository evidence, runs deterministic analyzers, computes category scores, and optionally synthesizes an AI narrative via OpenRouter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
      responses:
        "200":
          description: Structured repository ingestion report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "400":
          description: Invalid repository URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalysisRequest:
      type: object
      properties:
        repository_url:
          type: string
          minLength: 1
      required:
        - repository_url
    RepositoryInfo:
      type: object
      properties:
        url:
          type: string
        owner:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        default_branch:
          type: string
        stars:
          type: number
          minimum: 0
        forks:
          type: number
          minimum: 0
        open_issues:
          type: number
          minimum: 0
        language:
          type: ["string", "null"]
        size_kb:
          type: number
          minimum: 0
        topics:
          type: array
          items:
            type: string
      required:
        - url
        - owner
        - name
        - description
        - default_branch
        - stars
        - forks
        - open_issues
        - language
        - size_kb
        - topics
    RepositoryStatistics:
      type: object
      properties:
        total_files_found:
          type: number
          minimum: 0
        files_analyzed:
          type: number
          minimum: 0
        files_skipped:
          type: number
          minimum: 0
        total_source_size:
          type: number
          minimum: 0
        truncated:
          type: boolean
        truncation_reason:
          type: ["string", "null"]
      required:
        - total_files_found
        - files_analyzed
        - files_skipped
        - total_source_size
        - truncated
        - truncation_reason
    DependencyReport:
      type: object
      properties:
        has_dependency_management:
          type: boolean
        ecosystems:
          type: array
          items:
            type: string
        manifests:
          type: array
          items:
            type: string
        lockfiles:
          type: array
          items:
            type: string
        dependency_count:
          type: ["number", "null"]
          minimum: 0
        production_dependencies:
          type: ["number", "null"]
          minimum: 0
        development_dependencies:
          type: ["number", "null"]
          minimum: 0
        pinned_dependencies:
          type: ["number", "null"]
          minimum: 0
        loose_dependencies:
          type: ["number", "null"]
          minimum: 0
      required:
        - has_dependency_management
        - ecosystems
        - manifests
        - lockfiles
        - dependency_count
        - production_dependencies
        - development_dependencies
        - pinned_dependencies
        - loose_dependencies
    TestingReport:
      type: object
      properties:
        tests_detected:
          type: boolean
        test_file_count:
          type: number
          minimum: 0
        test_directories:
          type: array
          items:
            type: string
        frameworks:
          type: array
          items:
            type: string
        evidence_files:
          type: array
          items:
            type: string
      required:
        - tests_detected
        - test_file_count
        - test_directories
        - frameworks
        - evidence_files
    RepositoryFileSummary:
      type: object
      properties:
        path:
          type: string
        size:
          type: number
          minimum: 0
        type:
          type: string
          enum: [file]
        language:
          type: ["string", "null"]
        skipped:
          type: boolean
        skip_reason:
          type: ["string", "null"]
      required:
        - path
        - size
        - type
        - language
        - skipped
        - skip_reason
    Finding:
      type: object
      properties:
        title:
          type: string
        severity:
          type: string
          enum: [info, low, medium, high, critical]
        description:
          type: string
        evidence:
          type: array
          items:
            type: string
        category:
          type: string
        file:
          type: ["string", "null"]
        line:
          type: ["number", "null"]
          minimum: 1
        recommendation:
          type: ["string", "null"]
      required:
        - title
        - severity
        - description
        - evidence
        - category
        - file
        - line
        - recommendation
    CategoryScore:
      type: object
      properties:
        category:
          type: string
        score:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: [not_started, pending, complete]
      required:
        - category
        - score
        - status
    HealthReport:
      type: object
      properties:
        repository:
          $ref: "#/components/schemas/RepositoryInfo"
        overall_score:
          type: ["number", "null"]
          minimum: 0
          maximum: 100
        category_scores:
          type: array
          items:
            $ref: "#/components/schemas/CategoryScore"
        summary:
          type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        recommendations:
          type: array
          items:
            type: string
        phase:
          type: string
        statistics:
          $ref: "#/components/schemas/RepositoryStatistics"
        stats:
          $ref: "#/components/schemas/RepositoryStatistics"
        dependencies:
          $ref: "#/components/schemas/DependencyReport"
        testing:
          $ref: "#/components/schemas/TestingReport"
        languages:
          type: object
          additionalProperties:
            type: number
            minimum: 0
        files:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryFileSummary"
        strengths:
          type: array
          items:
            type: string
        weaknesses:
          type: array
          items:
            type: string
        architecture_insight:
          type: ["string", "null"]
        documentation_insight:
          type: ["string", "null"]
        ai_enabled:
          type: boolean
      required:
        - repository
        - overall_score
        - category_scores
        - summary
        - findings
        - recommendations
        - phase
        - statistics
        - stats
        - dependencies
        - testing
        - languages
        - files
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
